# Mull configuration for the parent test binaries (tests/tst_*).
#
# Reached only because tools/scripts/mutation.sh exports MULL_CONFIG; Mull
# otherwise looks for ./mull.yml in the working directory, which is the
# superproject root, and silently proceeds with defaults.
#
# excludePaths is the whole point of this file.  The parent test binaries link
# submodule sources, so without it Mull mutates vendored code -- kissfft and
# vog/sha1 alone contributed ~98 survivors to the committed baseline, none of
# which describe code this project owns or tests.
#
# Deliberately no `mutators:` key.  An earlier version pinned a narrower list
# than the recorded baseline was measured with, and since the file never
# reached Mull the two silently disagreed; leaving it unset keeps Mull's
# defaults, which is what the baseline actually reflects.  No `timeout:` key
# either -- Mull marks it deprecated and mutation.sh passes --timeout
# explicitly, so having both invites them to drift apart.
excludePaths:
  - .*/third_party/.*
  - .*/src/Test/.*
  # The parent's own test sources.  The submodule's suite dir above was
  # excluded from the start but this one was missed, so Mull was mutating the
  # tests themselves -- 163 of the 481 baselined survivors sat in tests/*.cpp.
  # A mutated assertion either breaks its test or does nothing; neither says
  # anything about the product, so every one of those entries was noise.
  - .*/tests/.*
  - .*/nlohmann/.*
  - .*/Eigen/.*
  - .*/doctest/.*
  - .*/kissfft/.*
