name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  # ── Arch Linux (.pkg.tar.zst, published from tagged releases) ─────────────
  # Same PKGBUILD an Arch user runs by hand from arch/. Dependencies come from
  # the PKGBUILD's own depends/makedepends arrays, so the list lives in one
  # place. makepkg refuses to run as root and this container is root, hence
  # the throwaway user. Container jobs run `run:` steps under sh unless told
  # otherwise, and the package jobs use bash arrays, so each pins bash.
  package-arch:
    name: Package .pkg.tar.zst — Arch Linux
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    container:
      image: archlinux:latest

    steps:
      - name: Sync packages and install git (needed for checkout action inside container)
        run: pacman -Syu --noconfirm git

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout submodules
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --force --recursive

      - name: Install PKGBUILD dependencies
        run: |
          source arch/PKGBUILD
          pacman -S --noconfirm --needed "${depends[@]}" "${makedepends[@]}"

      - name: Build package
        run: |
          useradd -m builder
          chown -R builder: "$GITHUB_WORKSPACE"
          cd arch
          runuser -u builder -- env WEK_REPO_ROOT="$GITHUB_WORKSPACE" \
            makepkg -f --noconfirm --skipchecksums

      - name: Collect package
        run: |
          mkdir -p dist
          mv -v arch/wallpaper-engine-kde-plugin-*-x86_64.pkg.tar.zst dist/
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-arch
          path: dist/*
          if-no-files-found: error

  # ── Fedora (.rpm, published from tagged releases) ─────────────────────────
  # Builds through the same SRPM path make-srpm.sh / build-packages.sh / COPR
  # use, so the artifact a tag publishes is exactly what a local rpmbuild
  # produces — not a separate compile-only check that can drift from it.
  package-rpm:
    name: Package .rpm — Fedora
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    container:
      image: fedora:latest

    steps:
      - name: Install git and RPM build tooling
        run: dnf install -y git rpm-build rpmdevtools

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout submodules
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --force --recursive

      - name: Enable RPM Fusion free (mpv-libs-devel lives there)
        run: dnf install -y "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm"

      - name: Build source RPM
        run: tools/scripts/make-srpm.sh --outdir "$PWD/build/srpm"

      - name: Install spec build dependencies
        run: dnf builddep -y build/srpm/*.src.rpm

      - name: Build RPM
        run: rpmbuild --rebuild --define "_topdir $PWD/build/rpmbuild" build/srpm/*.src.rpm

      - name: Collect RPM (drop -debuginfo/-debugsource — no debug packages published)
        run: |
          mkdir -p dist
          cp -v build/rpmbuild/RPMS/*/wallpaper-engine-kde-plugin-qt6-[0-9]*.rpm dist/
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: rpm-fedora
          path: dist/*
          if-no-files-found: error

  # ── Ubuntu / Debian (.deb, published from tagged releases) ────────────────
  # Matrix instead of two near-identical jobs: same steps, only the base
  # image and the resulting filename's distro label differ.
  package-deb:
    name: Package .deb — ${{ matrix.label }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:latest
            label: ubuntu
          - image: debian:stable
            label: debian
    container:
      image: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Install git (needed for checkout action inside container)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout submodules
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --force --recursive

      - name: Install packaging tools and build dependencies
        run: |
          apt-get install -y --no-install-recommends build-essential dpkg-dev fakeroot
          apt-get build-dep -y ./

      - name: Generate debian/changelog
        run: tools/scripts/gen-debian-changelog.sh

      - name: Build .deb
        run: dpkg-buildpackage -uc -us -b

      # Both distros produce the identical wallpaper-engine-kde-plugin_<ver>_<arch>.deb,
      # so the distro goes into the filename. The -dbgsym .ddeb is left behind on
      # purpose: no debug packages are published.
      - name: Collect .deb
        run: |
          mkdir -p dist
          . /etc/os-release
          arch="$(dpkg --print-architecture)"
          debs=(../wallpaper-engine-kde-plugin_*_"${arch}".deb)
          [ "${#debs[@]}" -eq 1 ] || { echo "expected exactly one .deb, found: ${debs[*]}" >&2; exit 1; }
          mv -v "${debs[0]}" "dist/$(basename "${debs[0]}" "_${arch}.deb")_${ID}-${VERSION_ID}_${arch}.deb"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  # ── Unit tests (Fedora, full Qt6 + KDE QML modules + libmpv) ───────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    env:
      CC: clang
      CXX: clang++

    steps:
      - name: Install git
        run: dnf install -y git

      - uses: actions/checkout@v4

      - name: Checkout submodules
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --force --recursive

      - name: Install test dependencies
        run: |
          dnf install -y --skip-unavailable \
            clang \
            cmake \
            ninja-build \
            pkgconf-pkg-config \
            qt6-qtbase-devel \
            qt6-qtdeclarative-devel \
            qt6-qtwebchannel-devel \
            qt6-qtwebengine-devel \
            mpv-devel \
            kf6-kirigami-devel \
            kf6-kconfig-devel \
            kf6-kcmutils \
            kf6-knotifications-devel \
            kf6-kcrash-devel \
            kf6-kglobalaccel-devel \
            kf6-ki18n-devel \
            kf6-kxmlgui-devel \
            plasma-workspace \
            libplasma-devel \
            plasma-workspace-devel \
            freetype-devel \
            pulseaudio-libs-devel \
            nodejs

      - name: Configure (standalone test build)
        run: |
          cmake -B build/tests -S tests \
            -DCMAKE_BUILD_TYPE=Debug \
            -G Ninja

      - name: Build
        run: cmake --build build/tests

      - name: Run tests
        run: ctest --test-dir build/tests --output-on-failure -V

  # ── Release (tag push only) ────────────────────────────────────────────────
  # A draft, not a published release: notes get a human pass before anything
  # goes public. Re-running the workflow against the same tag just re-attaches
  # the freshly built assets to whatever release already sits there.
  release:
    name: Publish release
    needs: [package-deb, package-rpm, package-arch, unit-tests]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -l dist

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" --draft --title "$TAG" --generate-notes dist/*
          fi
