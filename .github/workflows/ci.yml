name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── Arch Linux (primary target distribution) ──────────────────────────────
  build-arch:
    name: Full build — Arch Linux
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    env:
      CC: clang
      CXX: clang++

    steps:
      - name: Install git (needed for checkout action inside container)
        run: pacman -Sy --noconfirm git

      - uses: actions/checkout@v4

      - name: Checkout submodules
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --force --recursive

      - name: Install build dependencies
        run: |
          pacman -Su --noconfirm
          pacman -S --noconfirm \
            base-devel \
            clang \
            cmake \
            ninja \
            extra-cmake-modules \
            libplasma \
            kconfig \
            qt6-declarative \
            qt6-webchannel \
            vulkan-headers \
            mpv \
            lz4

      - name: Configure
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -G Ninja

      - name: Build
        run: cmake --build build -j$(nproc)

  # ── Fedora (secondary target distribution) ───────────────────────────────
  build-fedora:
    name: Full build — Fedora
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    env:
      CC: clang
      CXX: clang++

    steps:
      - name: Install git
        run: dnf install -y git

      - uses: actions/checkout@v4

      - name: Checkout submodules
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --force --recursive

      - name: Install build dependencies
        run: |
          dnf install -y \
            clang \
            cmake \
            ninja-build \
            extra-cmake-modules \
            vulkan-headers \
            plasma-workspace-devel \
            kf6-plasma-devel \
            kf6-kcoreaddons-devel \
            kf6-kpackage-devel \
            kf6-kconfig-devel \
            lz4-devel \
            mpv-devel \
            qt6-qtbase-private-devel \
            libplasma-devel \
            qt6-qtwebchannel-devel \
            qt6-qtdeclarative-devel

      - name: Configure
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -G Ninja

      - name: Build
        run: cmake --build build -j$(nproc)

  # ── Ubuntu (deb packaging target) ───────────────────────────────────────
  build-ubuntu:
    name: Full build — Ubuntu
    runs-on: ubuntu-latest
    container:
      image: ubuntu:25.04
    env:
      CC: clang
      CXX: clang++

    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y git

      - uses: actions/checkout@v4

      - name: Checkout submodules
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --force --recursive

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y \
            clang \
            cmake \
            ninja-build \
            extra-cmake-modules \
            pkg-config \
            libvulkan-dev \
            libkf6package-dev \
            libkf6config-dev \
            libplasma-dev \
            plasma-workspace-dev \
            qt6-base-dev \
            qt6-base-private-dev \
            qt6-declarative-dev \
            qt6-webchannel-dev \
            libmpv-dev \
            liblz4-dev \
            libfreetype-dev

      - name: Configure
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -G Ninja

      - name: Build
        run: cmake --build build -j$(nproc)

  # ── Unit tests (Fedora, full Qt6 + KDE QML modules + libmpv) ───────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    env:
      CC: clang
      CXX: clang++

    steps:
      - name: Install git
        run: dnf install -y git

      - uses: actions/checkout@v4

      - name: Checkout submodules
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --force --recursive

      - name: Install test dependencies
        run: |
          dnf install -y --skip-unavailable \
            clang \
            cmake \
            ninja-build \
            pkgconf-pkg-config \
            qt6-qtbase-devel \
            qt6-qtdeclarative-devel \
            qt6-qtwebchannel-devel \
            mpv-devel \
            kf6-kirigami-devel \
            kf6-kconfig-devel \
            kf6-kcmutils \
            plasma-workspace \
            libplasma-devel \
            plasma-workspace-devel \
            nodejs

      - name: Configure (standalone test build)
        run: |
          cmake -B build/tests -S tests \
            -DCMAKE_BUILD_TYPE=Debug \
            -G Ninja

      - name: Build
        run: cmake --build build/tests

      - name: Run tests
        run: ctest --test-dir build/tests --output-on-failure -V
